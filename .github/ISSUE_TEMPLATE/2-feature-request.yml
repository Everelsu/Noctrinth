name: 💡 Feature request
description: Suggest an idea for Noctrinth q(≧▽≦q)
type: 'feature'

body:
  - type: checkboxes
    attributes:
      label: Please confirm the following.
      options:
        - label: I checked the [existing issues](https://github.com/Everelsu/Noctrinth/issues?q=is%3Aissue) for duplicate feature requests
          required: true
        - label: This is about Noctrinth itself (Ely.by, imports, CurseForge import, etc.), not a general Modrinth App feature that belongs [upstream](https://github.com/modrinth/code/issues)
          required: true
  - type: textarea
    attributes:
      label: Is your suggested feature related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...] ( ˘ω˘ )
    validations:
      required: false
  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen. ٩(ˊᗜˋ*)و
    validations:
      required: false
  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the suggested enhancement here.
    validations:
      required: false
