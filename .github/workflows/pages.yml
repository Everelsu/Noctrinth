name: Deploy Site

# Builds the static site — the front page, the news from news/ with its feed for
# the launcher, and the changelog from the app's own changelog and upstream's
# (packages/blog/changelog.ts) — and publishes it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'apps/app-frontend/src/helpers/noctrinth-changelog.ts'
      - 'apps/app-frontend/src/changelog/screenshots/**'
      - 'packages/blog/changelog.ts'
      - 'apps/app/icons/noctrinth.svg'
      - 'scripts/build-changelog-site.mjs'
      - 'scripts/lib/**'
      - 'news/**'
      - '.github/assets/noctrinth-banner.svg'
      - '.github/assets/social-preview.png'
      - '.github/assets/screenshots/**'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; don't cancel in-progress ones so a deploy
# always finishes before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Build site
        run: node scripts/build-changelog-site.mjs site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
