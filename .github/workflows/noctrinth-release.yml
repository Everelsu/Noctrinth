name: Noctrinth Release

# Builds, signs and publishes Noctrinth desktop bundles to GitHub Releases.
# The Tauri updater (configured in apps/app/tauri.conf.json) reads the
# generated `latest.json` from the latest published release.
#
# Release flow:
#   1. Bump the version in apps/app-frontend/package.json (the single source of
#      truth — the crate versions and release name are derived from it).
#   2. Commit, then push a matching tag, e.g.
#        git tag v0.17.3 && git push origin v0.17.3
#      Either `v0.17.3` or `noctrinth-v0.17.3` triggers a release; the tag
#      name is only a label, the built version always comes from package.json.
#   3. This workflow builds every OS, creates a DRAFT release, uploads the
#      bundles + latest.json. Review it, then publish the draft — updates go
#      live for existing installs once the release is published.
#
# Note on tags: `git fetch upstream` pulls in Modrinth's own `v*` tags. Those
# stay local unless you run `git push --tags`; push only the specific release
# tag (`git push origin v0.17.3`) so an upstream tag never triggers a build.
# The `noctrinth-v*` pattern is offered as a collision-free alternative.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/noctrinth-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key password (empty string if none)
#   CURSEFORGE_API_KEY                  CurseForge API key; without it importing
#                                       a CurseForge modpack zip is disabled

on:
  push:
    tags:
      - 'v*'
      - 'noctrinth-v*'
      # Semver pre-release tags (`v0.17.4-beta.1`) belong to
      # noctrinth-prerelease.yml — excluded here so one tag never starts two
      # builds that would fight over the same GitHub release.
      - '!v*-*'
      - '!noctrinth-v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.17.3)'
        required: true

concurrency:
  group: noctrinth-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--features updater --target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: '--features updater'
          - platform: windows-latest
            args: '--features updater'

    runs-on: ${{ matrix.platform }}

    env:
      # Public Stripe publishable key used by the frontend build (safe to expose).
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Fix macOS compiler-rt (clang_rt) path
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          # GitHub's macos-latest (Xcode 16) relocated the static compiler-rt
          # libs, so linking the `cidre` crate fails with
          # "ld: library 'clang_rt.osx' not found" (the toolchain looks under a
          # clang/<ver>/lib/darwin path that no longer exists). Find the real
          # libclang_rt.osx.a and add its directory to LIBRARY_PATH so the
          # linker resolves -lclang_rt.osx regardless of the clang version dir.
          rt_lib=$(find "$(xcode-select -p)" -name 'libclang_rt.osx.a' 2>/dev/null | head -n1)
          if [ -n "$rt_lib" ]; then
            echo "Using compiler-rt at: $(dirname "$rt_lib")"
            echo "LIBRARY_PATH=$(dirname "$rt_lib"):${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          else
            echo "::warning::libclang_rt.osx.a not found under $(xcode-select -p)"
          fi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Prepare app-lib environment
        shell: bash
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Prepare CurseForge API key
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          # The CurseForge key is read raw from this file by vite.config.ts
          # (bypasses dotenv-expand so bcrypt-style `$` chars survive).
          # Without this step importing a CurseForge modpack zip fails.
          printf 'VITE_CURSEFORGE_API_KEY=%s\n' "$CURSEFORGE_API_KEY" \
            > apps/app-frontend/.env.local

      - name: Check the version is a stable one
        shell: bash
        run: |
          # A stable build must not ship a pre-release version: the updater
          # manifest published by this workflow is what every existing install
          # follows, so a `-beta` slipping through would push a beta to
          # everyone. Pre-releases go through noctrinth-prerelease.yml.
          VERSION=$(tr -d "[:space:]" < VERSION)
          case "$VERSION" in
            *-*)
              echo "::error::VERSION is at pre-release $VERSION. Use the Noctrinth Pre-release workflow, or set a stable version."
              exit 1
              ;;
          esac
          echo "Building stable version $VERSION"

      - name: Sync versions from the VERSION file
        shell: bash
        run: |
          # VERSION at the repo root is the one place a release number is
          # written by hand; this mirrors it into app-frontend/package.json,
          # which Tauri reads, and into the Rust crates. Reading it here rather
          # than parsing the git tag means a tag named `v0.17.3` can never
          # write a non-semver version into Cargo.toml.
          node scripts/sync-version.mjs

      - name: Install dependencies
        run: pnpm install

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Noctrinth __VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify Linux bundles declare their bundle type
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -eo pipefail

          # The updater decides how to install itself from a marker the bundler
          # patches into each binary. Tauri CLI 2.5 never wrote it, so
          # `bundle_type()` returned None and *every* Linux install fell through
          # to rewriting the executable in place — which, for a .deb installed
          # under /usr, dies as "Permission denied (os error 13)".
          #
          # The fix was to move the CLI forward, but the release is built by
          # tauri-action, which may not use the CLI pinned in package.json.
          # So assert the marker on the artifacts themselves instead of trusting
          # a version number: if the toolchain ever regresses, this fails here
          # rather than in a user's update a release later.
          UNPATCHED='__TAURI_BUNDLE_TYPE_VAR_UNK'
          failed=0

          echo "tauri CLI: $(cd apps/app && pnpm exec tauri --version)"

          check() {
            local label="$1" file="$2" expected="$3"
            if grep -aq "$expected" "$file"; then
              echo "  ok: $label declares $expected"
            elif grep -aq "$UNPATCHED" "$file"; then
              echo "::error::$label was bundled without a bundle type ($UNPATCHED left in place). Its updater would try to overwrite the installed binary and fail with os error 13."
              failed=1
            else
              echo "::error::$label carries neither $expected nor $UNPATCHED — the marker moved or the binary was stripped; the check needs revisiting."
              failed=1
            fi
          }

          shopt -s nullglob
          found=0

          for appimage in target/release/bundle/appimage/*.AppImage; do
            found=1
            # An AppImage is a compressed squashfs, so the marker is not
            # greppable in the file itself — unpack it first. `--appimage-extract`
            # needs no FUSE, which the runner does not have.
            workdir=$(mktemp -d)
            chmod +x "$appimage"
            abs_appimage=$(readlink -f "$appimage")
            (cd "$workdir" && "$abs_appimage" --appimage-extract >/dev/null)
            binary=$(find "$workdir/squashfs-root" -type f -executable -print0 \
              | xargs -0 file --mime-type \
              | grep -m1 'application/x-\(pie-\)\?executable' \
              | cut -d: -f1 || true)
            if [ -z "$binary" ]; then
              echo "::error::no executable found inside $(basename "$appimage")"
              failed=1
            else
              check "$(basename "$appimage")" "$binary" '__TAURI_BUNDLE_TYPE_VAR_APP'
            fi
            rm -rf "$workdir"
          done

          for deb in target/release/bundle/deb/*.deb; do
            found=1
            workdir=$(mktemp -d)
            dpkg-deb -x "$deb" "$workdir"
            # The executable name follows productName, so locate it rather than
            # hard-coding a path that a rename would silently break.
            # `|| true`: grep -m1 closes the pipe early, and with pipefail the
            # SIGPIPE upstream would otherwise fail the whole step under set -e.
            binary=$(find "$workdir" -type f -executable -print0 \
              | xargs -0 file --mime-type \
              | grep -m1 'application/x-\(pie-\)\?executable' \
              | cut -d: -f1 || true)
            if [ -z "$binary" ]; then
              echo "::error::no executable found inside $(basename "$deb")"
              failed=1
            else
              check "$(basename "$deb")" "$binary" '__TAURI_BUNDLE_TYPE_VAR_DEB'
            fi
            rm -rf "$workdir"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::no Linux bundles found under target/release/bundle — did the bundle output path move?"
            exit 1
          fi

          exit "$failed"

  # Moves the updater manifest off the release page: `latest.json` is committed
  # to the `updater` branch and, together with the `.sig` signature files, is
  # removed from the release so only the actual installers remain visible.
  finalize:
    name: Publish updater manifest
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release notes from Noctrinth changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Match the changelog entry by the package.json version, the same
          # source the crate versions came from — independent of the tag name.
          VERSION=$(tr -d "[:space:]" < VERSION)

          # Pull the matching entry out of noctrinth-changelog.ts. If there
          # isn't one we leave the auto-generated body alone rather than fail
          # the whole release pipeline.
          if node scripts/extract-changelog.mjs "$VERSION" RELEASE_BODY.md; then
            echo "Updating release body for $TAG"
            gh release edit "$TAG" --notes-file RELEASE_BODY.md
          else
            echo "::warning::No changelog entry for $VERSION — release body left as-is"
          fi

      - name: Relocate updater manifest and strip signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Grab the updater manifest produced by the build jobs.
          mkdir -p manifest
          gh release download "$TAG" --pattern latest.json --dir manifest --clobber

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit latest.json to the dedicated `updater` branch (orphan branch
          # holding only the manifest — the Tauri updater endpoint points here).
          if git ls-remote --exit-code --heads origin updater >/dev/null 2>&1; then
            git fetch origin updater
            git checkout updater
          else
            git checkout --orphan updater
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp manifest/latest.json latest.json
          git add latest.json
          git commit -m "updater: $TAG" || echo "Manifest unchanged"
          git push origin updater

          # Remove the manifest and signature files from the release page so
          # only the installers are shown to users.
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -E '(^latest\.json$|\.sig$)' \
            | while read -r asset; do
                echo "Removing release asset: $asset"
                gh release delete-asset "$TAG" "$asset" --yes
              done
