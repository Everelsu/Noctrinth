name: Noctrinth Pre-release

# Builds and publishes a Noctrinth pre-release (beta / rc) to GitHub Releases.
#
# The difference from noctrinth-release.yml is what happens to the updater:
# this workflow deliberately does NOT publish `latest.json` to the `updater`
# branch. That branch is the endpoint every installed copy polls (see
# apps/app/tauri.conf.json), so writing a beta there would hand the beta to
# everyone. Pre-releases are install-it-yourself from the release page.
#
# Because the version carries a semver pre-release suffix, the ordering works
# out on its own:
#   0.17.3  <  0.17.4-beta.1  <  0.17.4
# so a tester on a beta is offered the stable 0.17.4 as soon as it ships.
#
# Release flow:
#   1. Set a pre-release version in apps/app-frontend/package.json — it must
#      carry a suffix, e.g. `0.17.4-beta.1` or `0.17.4-rc.2`. This is the
#      single source of truth; the crate versions and the release name are
#      derived from it.
#   2. Commit, then push a matching tag, e.g.
#        git tag noctrinth-v0.17.4-beta.1 && git push origin noctrinth-v0.17.4-beta.1
#      Either `v0.17.4-beta.1` or `noctrinth-v0.17.4-beta.1` triggers this
#      workflow; the tag name is only a label, the built version always comes
#      from package.json.
#   3. This workflow builds every OS and creates a DRAFT release flagged as a
#      pre-release. Review it, then publish.
#   4. When the stable release is ready, drop the suffix from package.json and
#      use the Noctrinth Release workflow instead.
#
# Required repository secrets: the same set as noctrinth-release.yml.

on:
  push:
    tags:
      # Only semver pre-release tags — a plain `v0.17.4` belongs to
      # noctrinth-release.yml.
      - 'v*-*'
      - 'noctrinth-v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing pre-release tag to build (e.g. v0.17.4-beta.1)'
        required: true

concurrency:
  group: noctrinth-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--features updater --target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: '--features updater'
          - platform: windows-latest
            args: '--features updater'

    runs-on: ${{ matrix.platform }}

    env:
      # Public Stripe publishable key used by the frontend build (safe to expose).
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Fix macOS compiler-rt (clang_rt) path
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          # GitHub's macos-latest (Xcode 16) relocated the static compiler-rt
          # libs, so linking the `cidre` crate fails with
          # "ld: library 'clang_rt.osx' not found" (the toolchain looks under a
          # clang/<ver>/lib/darwin path that no longer exists). Find the real
          # libclang_rt.osx.a and add its directory to LIBRARY_PATH so the
          # linker resolves -lclang_rt.osx regardless of the clang version dir.
          rt_lib=$(find "$(xcode-select -p)" -name 'libclang_rt.osx.a' 2>/dev/null | head -n1)
          if [ -n "$rt_lib" ]; then
            echo "Using compiler-rt at: $(dirname "$rt_lib")"
            echo "LIBRARY_PATH=$(dirname "$rt_lib"):${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          else
            echo "::warning::libclang_rt.osx.a not found under $(xcode-select -p)"
          fi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Prepare app-lib environment
        shell: bash
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Prepare CurseForge API key
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          # The CurseForge key is read raw from this file by vite.config.ts
          # (bypasses dotenv-expand so bcrypt-style `$` chars survive).
          # Without this step importing a CurseForge modpack zip fails.
          printf 'VITE_CURSEFORGE_API_KEY=%s\n' "$CURSEFORGE_API_KEY" \
            > apps/app-frontend/.env.local

      - name: Check the version is a pre-release one
        shell: bash
        run: |
          # Guards the mistake this split invites: tagging `-beta.1` while
          # package.json still holds a stable version would build and publish a
          # normal release under a pre-release tag.
          VERSION=$(node -p "require('./apps/app-frontend/package.json').version")
          case "$VERSION" in
            *-*) echo "Building pre-release version $VERSION" ;;
            *)
              echo "::error::apps/app-frontend/package.json is at stable version $VERSION. Give it a pre-release suffix (e.g. $VERSION-beta.1), or use the Noctrinth Release workflow."
              exit 1
              ;;
          esac

      - name: Sync crate versions from package.json
        shell: bash
        run: |
          # The app version lives in app-frontend/package.json; mirror it into
          # the Rust crates so the user-agent and crate metadata stay in sync.
          # Reading it here (rather than parsing the git tag) means a tag named
          # `v0.17.4-beta.1` — or anything else — can never write an invalid
          # version into Cargo.toml, which Cargo rejects as non-semver.
          VERSION=$(node -p "require('./apps/app-frontend/package.json').version")
          echo "Setting crate versions to $VERSION"
          for f in apps/app/Cargo.toml packages/app-lib/Cargo.toml; do
            # `sed -i` is not portable (GNU vs BSD/macOS), so write to a temp
            # file and move it back. The `1,/.../` range limits the change to
            # the first `version =` line — the [package] version.
            sed "1,/^version = .*/ s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Install dependencies
        run: pnpm install

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Noctrinth __VERSION__'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  # Same presentation pass as the stable workflow — release notes from the
  # changelog and no updater plumbing left on the release page — except that
  # `latest.json` is discarded rather than committed to the `updater` branch.
  finalize:
    name: Finalize pre-release
    needs: prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release notes from Noctrinth changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Match the changelog entry by the package.json version, the same
          # source the crate versions came from — independent of the tag name.
          VERSION=$(node -p "require('./apps/app-frontend/package.json').version")

          if node scripts/extract-changelog.mjs "$VERSION" RELEASE_BODY.md; then
            echo "Updating release body for $TAG"
          else
            echo "::warning::No changelog entry for $VERSION — using a placeholder body"
            printf '%s\n' "Pre-release build \`$VERSION\`." > RELEASE_BODY.md
          fi

          # Testers need to know this build will not arrive by auto-update.
          # Written with printf rather than a heredoc: a heredoc terminator
          # cannot be indented, and un-indenting it inside a YAML block scalar
          # is a parse error.
          printf '\n---\n\n**This is a pre-release.** It is not served to the auto-updater, so install it manually. Once the matching stable release ships, the app will offer it as a normal update.\n' \
            >> RELEASE_BODY.md

          gh release edit "$TAG" --notes-file RELEASE_BODY.md --prerelease

      - name: Strip updater manifest and signatures from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # `latest.json` is intentionally NOT committed to the `updater`
          # branch here — see the note at the top of this file. Removing it (and
          # the detached signatures) leaves only the installers on the page.
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -E '(^latest\.json$|\.sig$)' \
            | while read -r asset; do
                echo "Removing release asset: $asset"
                gh release delete-asset "$TAG" "$asset" --yes
              done
