name: 🐛 Bug report
description: Something in Noctrinth isn't working right. ￣へ￣
labels: [bug]
type: 'bug'
body:
  - type: checkboxes
    attributes:
      label: Please confirm the following.
      options:
        - label: I checked the [existing issues](https://github.com/Everelsu/Noctrinth/issues?q=is%3Aissue) for duplicate reports
          required: true
        - label: I have ensured my Noctrinth installation is up to date
          required: true
        - label: This is a Noctrinth-specific issue, not a bug in the upstream [Modrinth App](https://github.com/modrinth/code/issues) that I should report there instead
          required: true
  - type: input
    id: version
    attributes:
      label: What version of Noctrinth are you using?
      description: Find this in ⚙️ Settings
    validations:
      required: true
  - type: dropdown
    id: oses
    attributes:
      label: What operating systems are you seeing the problem on?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. Include screenshots if applicable. (´；ω；`)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error (╯°□°)╯
    validations:
      required: false
  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
