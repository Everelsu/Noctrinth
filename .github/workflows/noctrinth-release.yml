name: Noctrinth Release

# Builds, signs and publishes Noctrinth desktop bundles to GitHub Releases.
# The Tauri updater (configured in apps/app/tauri.conf.json) reads the
# generated `latest.json` from the latest published release.
#
# Release flow:
#   1. Bump the version in apps/app-frontend/package.json (the single source of
#      truth — the crate versions and release name are derived from it).
#   2. Commit, then push a matching tag, e.g.
#        git tag v0.17.3 && git push origin v0.17.3
#      Either `v0.17.3` or `noctrinth-v0.17.3` triggers a release; the tag
#      name is only a label, the built version always comes from package.json.
#   3. This workflow builds every OS, creates a DRAFT release, uploads the
#      bundles + latest.json. Review it, then publish the draft — updates go
#      live for existing installs once the release is published.
#
# Note on tags: `git fetch upstream` pulls in Modrinth's own `v*` tags. Those
# stay local unless you run `git push --tags`; push only the specific release
# tag (`git push origin v0.17.3`) so an upstream tag never triggers a build.
# The `noctrinth-v*` pattern is offered as a collision-free alternative.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/noctrinth-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key password (empty string if none)

on:
  push:
    tags:
      - 'v*'
      - 'noctrinth-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.17.3)'
        required: true

concurrency:
  group: noctrinth-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--features updater --target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: '--features updater'
          - platform: windows-latest
            args: '--features updater'

    runs-on: ${{ matrix.platform }}

    env:
      # Public Stripe publishable key used by the frontend build (safe to expose).
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            build-essential \
            libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Fix macOS compiler-rt (clang_rt) path
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          # GitHub's macos-latest (Xcode 16) relocated the static compiler-rt
          # libs, so linking the `cidre` crate fails with
          # "ld: library 'clang_rt.osx' not found" (the toolchain looks under a
          # clang/<ver>/lib/darwin path that no longer exists). Find the real
          # libclang_rt.osx.a and add its directory to LIBRARY_PATH so the
          # linker resolves -lclang_rt.osx regardless of the clang version dir.
          rt_lib=$(find "$(xcode-select -p)" -name 'libclang_rt.osx.a' 2>/dev/null | head -n1)
          if [ -n "$rt_lib" ]; then
            echo "Using compiler-rt at: $(dirname "$rt_lib")"
            echo "LIBRARY_PATH=$(dirname "$rt_lib"):${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          else
            echo "::warning::libclang_rt.osx.a not found under $(xcode-select -p)"
          fi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Prepare app-lib environment
        shell: bash
        run: |
          cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Sync crate versions from package.json
        shell: bash
        run: |
          # The app version lives in app-frontend/package.json; mirror it into
          # the Rust crates so the user-agent and crate metadata stay in sync.
          # Reading it here (rather than parsing the git tag) means a tag named
          # `v0.17.3` — or anything else — can never write an invalid version
          # like "v0.17.3" into Cargo.toml, which Cargo rejects as non-semver.
          VERSION=$(node -p "require('./apps/app-frontend/package.json').version")
          echo "Setting crate versions to $VERSION"
          for f in apps/app/Cargo.toml packages/app-lib/Cargo.toml; do
            # `sed -i` is not portable (GNU vs BSD/macOS), so write to a temp
            # file and move it back. The `1,/.../` range limits the change to
            # the first `version =` line — the [package] version.
            sed "1,/^version = .*/ s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Install dependencies
        run: pnpm install

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Noctrinth __VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Moves the updater manifest off the release page: `latest.json` is committed
  # to the `updater` branch and, together with the `.sig` signature files, is
  # removed from the release so only the actual installers remain visible.
  finalize:
    name: Publish updater manifest
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release notes from Noctrinth changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Match the changelog entry by the package.json version, the same
          # source the crate versions came from — independent of the tag name.
          VERSION=$(node -p "require('./apps/app-frontend/package.json').version")

          # Pull the matching entry out of noctrinth-changelog.ts. If there
          # isn't one we leave the auto-generated body alone rather than fail
          # the whole release pipeline.
          if node scripts/extract-changelog.mjs "$VERSION" RELEASE_BODY.md; then
            echo "Updating release body for $TAG"
            gh release edit "$TAG" --notes-file RELEASE_BODY.md
          else
            echo "::warning::No changelog entry for $VERSION — release body left as-is"
          fi

      - name: Relocate updater manifest and strip signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Grab the updater manifest produced by the build jobs.
          mkdir -p manifest
          gh release download "$TAG" --pattern latest.json --dir manifest --clobber

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit latest.json to the dedicated `updater` branch (orphan branch
          # holding only the manifest — the Tauri updater endpoint points here).
          if git ls-remote --exit-code --heads origin updater >/dev/null 2>&1; then
            git fetch origin updater
            git checkout updater
          else
            git checkout --orphan updater
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp manifest/latest.json latest.json
          git add latest.json
          git commit -m "updater: $TAG" || echo "Manifest unchanged"
          git push origin updater

          # Remove the manifest and signature files from the release page so
          # only the installers are shown to users.
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -E '(^latest\.json$|\.sig$)' \
            | while read -r asset; do
                echo "Removing release asset: $asset"
                gh release delete-asset "$TAG" "$asset" --yes
              done
